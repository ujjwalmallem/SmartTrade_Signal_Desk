# Save this file as: .github/workflows/signal-tracker.yml
#
# Runs the signal tracker every 15 minutes, all day, every day. This looks
# wasteful but isn't: signal_tracker.py's own is_extended_hours_now() check
# is the real, precise gate — it no-ops instantly outside 4:00am-8:00pm ET
# on weekdays (pre-market/regular/after-hours), and even on weekends/nights
# it still has real work to do for BTC-USD/ETH-USD, which trade 24/7. The
# cron schedule is deliberately coarse on purpose (same philosophy as
# before, just widened) — the Python-side check is what actually decides
# whether a given run does anything.
#
# Persistence: GitHub Actions runners are thrown away after every run, so
# there's no Google Drive to mount here. Instead, this workflow commits the
# updated signal_desk_log.csv straight back to the repo after each run —
# which has the nice side effect of giving you a full git history of every
# signal ever logged.

name: Signal Desk Tracker

on:
  schedule:
    # every 15 minutes, every hour, every day — see the note above on why
    # this is intentionally coarse; signal_tracker.py's own clock check
    # (is_extended_hours_now) is what actually filters this down to
    # 4:00am-8:00pm ET weekdays for equities, plus all weekend hours for
    # crypto tracking.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # lets you manually trigger a run from the Actions tab

permissions:
  contents: write   # needed to commit the updated log file back to the repo

jobs:
  track-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal tracker
        env:
          SIGNAL_DESK_MODE: tracker              # skip the heavy backtest/deep-dive every run
          SIGNAL_LOG_PATH: signal_desk_log.csv   # lives in the repo root, so it can be committed
        run: python signal_tracker.py

      - name: Commit updated signal log
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add signal_desk_log.csv
          if git diff --cached --quiet; then
            echo "No changes to the log this run — nothing to commit."
          else
            git commit -m "Update signal log [skip ci]"
            git push
          fi
